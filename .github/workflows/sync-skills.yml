name: sync-skills

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      galaxy_skills_ref:
        description: galaxy-skills branch, tag or commit
        default: main
      foundry_ref:
        description: foundry branch, tag or commit
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor upstream skills
        env:
          GALAXY_SKILLS_REF: ${{ github.event.inputs.galaxy_skills_ref || 'main' }}
          FOUNDRY_REF: ${{ github.event.inputs.foundry_ref || 'main' }}
        run: scripts/sync-skills.sh
      - name: Summarise
        id: summary
        run: |
          {
            echo "body<<EOF"
            echo "Automated sync of vendored skills."
            echo
            for p in galaxy-skills foundry-skills; do
              echo "- **$p**: $(python3 -c "import json;d=json.load(open('plugins/$p/UPSTREAM.json'));print(d['repository']+'@'+d['commit'][:12])")"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/skills
          title: "Sync vendored skills from upstream"
          commit-message: "Sync vendored skills from upstream"
          body: ${{ steps.summary.outputs.body }}
          delete-branch: true
