name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Structure (validate.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
      - run: python3 scripts/cursor-deeplink.py --check

  claude-code:
    name: Claude Code (plugin validate --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  codex:
    name: Codex (headless install + inventory)
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: ${{ github.workspace }}/.codex-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @openai/codex && codex --version
      - name: Codex plugin-creator validator (all plugins)
        run: |
          pip install pyyaml
          base=https://raw.githubusercontent.com/openai/codex/main/codex-rs/skills/src/assets/samples/plugin-creator/scripts
          mkdir -p /tmp/codex-validator
          for f in validate_plugin.py identifier_validation.py; do curl -fsSL -o /tmp/codex-validator/$f "$base/$f"; done
          for p in plugins/*/; do python3 /tmp/codex-validator/validate_plugin.py "$p"; done
      - name: Install from this checkout as a local marketplace
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          for p in galaxy-mcp galaxy-skills galaxy-dev-skills foundry-skills; do codex plugin add "$p@galaxyproject"; done
      - name: MCP server registered with forwarded env
        run: |
          codex mcp list | tee /tmp/mcp.txt
          grep -E '^galaxy +uvx +galaxy-mcp' /tmp/mcp.txt
      - name: Skills visible in the model prompt (no auth needed)
        run: |
          git init -q /tmp/ws && cd /tmp/ws
          codex debug prompt-input "hello" > /tmp/prompt.json
          n=$(grep -oE '(galaxy-skills|galaxy-dev-skills|foundry-skills|galaxy-mcp):[a-z0-9-]+' /tmp/prompt.json | sort -u | wc -l)
          echo "skills in prompt: $n"
          test "$n" -ge 70
          for s in galaxy-mcp:galaxy-connect galaxy-skills:udt-authoring galaxy-skills:collection-manipulation galaxy-dev-skills:tool-dev galaxy-dev-skills:nf-process-to-galaxy-tool foundry-skills:discover-shed-tool; do
            grep -q "$s" /tmp/prompt.json || { echo "missing $s"; exit 1; }
          done

  antigravity:
    name: Antigravity (agy plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5   # agy validate checks that MCP commands (uvx) exist on PATH
      - name: Install agy
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: for p in plugins/*/; do agy plugin validate "$p"; done

  pi:
    name: Pi (skill loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd .github/ci-tools && npm install --no-audit --no-fund
      - run: cd .github/ci-tools && node check-pi-skills.mjs "$GITHUB_WORKSPACE"

  mcp-smoke:
    name: galaxy-mcp starts (uvx and Claude Desktop bundle)
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in a step `if`; expose it via job env instead
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
      GALAXY_URL: ${{ vars.GALAXY_URL || 'https://usegalaxy.org' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uvx galaxy-mcp
        run: python3 scripts/mcp_smoke.py uvx galaxy-mcp
      - name: Bundle entry point (uv run)
        run: python3 scripts/mcp_smoke.py uv run --directory bundles/claude-desktop src/server.py
      - name: Live Galaxy check (only when the GALAXY_API_KEY secret is set)
        if: ${{ env.GALAXY_API_KEY != '' }}
        run: python3 scripts/mcp_smoke.py --live uvx galaxy-mcp

  claude-desktop-bundle:
    name: Claude Desktop bundle (mcpb validate + pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/mcpb validate bundles/claude-desktop/manifest.json
      - run: mkdir -p dist && npx -y @anthropic-ai/mcpb pack bundles/claude-desktop dist/galaxy-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-mcp.mcpb
          path: dist/galaxy-mcp.mcpb
