name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Attach Claude Desktop bundle to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/mcpb validate bundles/claude-desktop/manifest.json
      - run: mkdir -p dist && npx -y @anthropic-ai/mcpb pack bundles/claude-desktop dist/galaxy-mcp.mcpb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/galaxy-mcp.mcpb
          generate_release_notes: true
